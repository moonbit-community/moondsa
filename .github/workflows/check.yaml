name: check

on:
  schedule:
    - cron: "30 2 * * 5"
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  MOON_WORK: "off"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        toolchain: [latest]
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            toolchain: nightly
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@develop
        with:
          version: ${{ matrix.toolchain }}
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Check
        run: |
          moon version --all
          moon update
          moon check --target all --deny-warn
      - name: Test debug and release
        run: |
          moon test --target all --deny-warn
          moon test --target all --release --deny-warn
      - name: Verify interfaces and formatting
        run: |
          moon info --target all
          moon fmt
          git diff --exit-code
